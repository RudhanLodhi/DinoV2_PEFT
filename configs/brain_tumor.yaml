# ===== Brain Tumor MRI Dataset Configuration =====

dataset:
  name: brain_tumor
  source: ultralytics_ndjson   # ultralytics_ndjson | folder
  ndjson_path: cheng-brain-tumor-mri-detection.ndjson
  class_names:
    0: meningioma
    1: glioma
    2: pituitary
  num_classes: 3
  image_size_native: 512
  retain_bbox_metadata: true   # store boxes as metadata, not used for classification

preprocessing:
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  train_augmentation: true

training:
  batch_size: 32
  num_epochs: 20
  lora_lr: 2.0e-4
  head_lr: 5.0e-3
  weight_decay: 0.01
  fp16: true
  seed: 42
  output_dir: outputs/brain_tumor
  logging_steps: 20
  eval_strategy: epoch
  save_total_limit: 2
