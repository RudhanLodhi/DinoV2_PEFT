# ===== CheXpert Dataset Configuration =====
# Reference: Baharoon et al. (2024, arXiv:2312.02366v4).
# Matches 0_Baseline_CheXpert.ipynb: 5 competition labels, 10k frontal subset,
# official validation split for model selection, deterministic test carve-out.

dataset:
  name: chexpert
  hf_repo: danjacobellis/chexpert
  image_column: image
  # 5 CheXpert competition labels (paper's classification benchmark).
  label_names:
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Pleural Effusion
  num_labels: 5
  # Label schema in danjacobellis/chexpert uses 4-class integer encoding:
  #   0 = unlabeled, 1 = uncertain, 2 = absent (negative), 3 = present (positive)
  hf_4class_encoding: true
  uncertainty_policy: u_zeros   # u_zeros | u_ones
  frontal_only: true

subset:
  train_size: 10000    # 10000 | 20000 | null (full)
  val_fixed: true      # always use full official validation split (model selection)
  test_fixed: true     # deterministic carve-out from train subset (held-out test)
  test_fraction: 0.2   # fraction of the train subset reserved for held-out test
  seed: 42

preprocessing:
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  train_augmentation: true
  crop_scale_min: 0.75   # RandomResizedCrop scale (paper protocol)
  crop_scale_max: 1.0
  resize_ratio: 1.14     # eval Resize(image_size * ratio) before CenterCrop

training:
  batch_size: 128
  num_epochs: 20
  optimizer: SGD
  sgd_momentum: 0.9
  learning_rate: 1.0e-2   # linear-probe LR from the paper's grid (no per-label scaling)
  lora_lr: 2.0e-4
  head_lr: 5.0e-3
  weight_decay: 0.0
  fp16: true
  seed: 42
  output_dir: outputs/chexpert
  logging_steps: 50
  eval_strategy: epoch
  save_total_limit: 2
