[metadata]
name = dinov2_peft
version = 0.1.0
description = PEFT fine-tuning of DINOv2 for medical image classification
author = Research Team

[options]
packages = find:
package_dir = = src
python_requires = >=3.10
install_requires =
    torch>=2.1.0
    transformers>=4.40.0
    datasets>=2.18.0
    peft>=0.10.0
    accelerate>=0.28.0
    scikit-learn>=1.4.0
    pyyaml>=6.0.1
    numpy>=1.26.0
    pillow>=10.2.0

[options.packages.find]
where = src
